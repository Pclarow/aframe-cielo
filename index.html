<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Módulo 03 · Meteoritos en Atacama</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; }
  #hud { position: fixed; top: 14px; left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 20px;
         color: #fff; font-size: 20px; font-weight: 700; text-shadow: 0 2px 6px #000; pointer-events: none; z-index: 10; }
  #aviso { position: fixed; top: 38%; left: 0; right: 0; text-align: center; color: #ffd166; font-size: 54px; font-weight: 900;
           text-shadow: 0 4px 16px #000; pointer-events: none; opacity: 0; transition: opacity .25s; z-index: 10; }
  #flash { position: fixed; inset: 0; background: #ff3b1f; opacity: 0; pointer-events: none; transition: opacity .4s; z-index: 9; }
  #inicio { position: fixed; inset: 0; background: rgba(5,8,20,.86); color: #fff; display: flex; flex-direction: column;
            align-items: center; justify-content: center; text-align: center; padding: 24px; z-index: 20; cursor: pointer; }
  #inicio h1 { font-size: 40px; margin: 0 0 12px; color: #ffd166; }
  #inicio p { font-size: 18px; max-width: 520px; line-height: 1.5; margin: 6px 0; }
  #inicio .btn { margin-top: 22px; background: #ffd166; color: #111; font-weight: 800; padding: 12px 28px; border-radius: 999px; font-size: 20px; }
</style>
<script>
  // ---------- Campo de estrellas ----------
  AFRAME.registerComponent('estrellas', {
    schema: { cantidad: { default: 900 } },
    init() {
      for (let i = 0; i < this.data.cantidad; i++) {
        const s = document.createElement('a-sphere');
        const th = Math.random() * Math.PI * 2, ph = Math.acos(Math.random() * 0.95), r = 80;
        s.setAttribute('position', `${r * Math.sin(ph) * Math.cos(th)} ${r * Math.cos(ph)} ${r * Math.sin(ph) * Math.sin(th)}`);
        s.setAttribute('radius', 0.08 + Math.random() * 0.18);
        s.setAttribute('material', `shader: flat; color: ${Math.random() < 0.15 ? '#ffd9a8' : '#ffffff'}`);
        this.el.appendChild(s);
      }
    }
  });

  // ---------- Sonidos con Web Audio ----------
  let audio = null;
  function sonido(tipo) {
    try {
      audio = audio || new AudioContext();
      const t = audio.currentTime;
      const largo = tipo === 'golpe' ? 0.12 : 0.9;
      const buffer = audio.createBuffer(1, audio.sampleRate * largo, audio.sampleRate);
      const datos = buffer.getChannelData(0);
      for (let i = 0; i < datos.length; i++) datos[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / datos.length, tipo === 'golpe' ? 6 : 2);
      const fuente = audio.createBufferSource(); fuente.buffer = buffer;
      const filtro = audio.createBiquadFilter();
      filtro.type = tipo === 'golpe' ? 'highpass' : 'lowpass';
      filtro.frequency.value = tipo === 'golpe' ? 1800 : 260;
      const vol = audio.createGain(); vol.gain.value = tipo === 'golpe' ? 0.9 : 1.2;
      fuente.connect(filtro); filtro.connect(vol); vol.connect(audio.destination);
      fuente.start(t);
    } catch (e) {}
  }

  // ---------- El juego ----------
  AFRAME.registerComponent('juego', {
    init() {
      this.camara = document.querySelector('#camara');
      this.pivote = document.querySelector('#bate').object3D;
      this.meteoritos = [];
      this.jugando = false;
      this.tiempoSwing = 1;          // 0 = empezando a batear, 1 = en reposo
      this.hud = { puntos: document.querySelector('#puntos'), vidas: document.querySelector('#vidas') };
      this.aviso = document.querySelector('#aviso');
      this.flash = document.querySelector('#flash');
      this.inicio = document.querySelector('#inicio');
      this.textoVR = document.querySelector('#textoVR');
      this.hudVR = document.querySelector('#hudVR');
      this.batesVR = [];                 // bates pegados a los controles del visor
      this.modoVR = false;

      this.geo = new THREE.IcosahedronGeometry(0.45, 0);
      this.geoCola = new THREE.ConeGeometry(0.4, 3, 8, 1, true);
      this.geoChispa = new THREE.TetrahedronGeometry(0.18);
      this.particulas = [];              // chispas de las explosiones

      const batear = () => { if (this.jugando) this.batear(); };
      window.addEventListener('keydown', (e) => { if (e.code === 'Space') batear(); });
      this.el.addEventListener('mousedown', batear);
      this.el.addEventListener('touchstart', batear);
      this.inicio.addEventListener('click', () => this.empezar());

      // ----- realidad virtual -----
      this.el.addEventListener('enter-vr', () => {
        if (!this.el.is('vr-mode')) return;
        this.modoVR = true;
        this.inicio.style.display = 'none';
        this.hudVR.setAttribute('visible', true);
        document.querySelector('#bate').setAttribute('visible', false);   // el bate de pantalla no se usa en VR
        document.querySelector('#mira').setAttribute('visible', false);
        this.prepararControles();
        if (!this.jugando) this.cuentaRegresiva('METEORITOS EN ATACAMA. Batea moviendo el brazo. Empieza en', 3);
      });
      this.el.addEventListener('exit-vr', () => {
        this.modoVR = false;
        this.hudVR.setAttribute('visible', false);
        document.querySelector('#bate').setAttribute('visible', true);
        document.querySelector('#mira').setAttribute('visible', true);
        this.textoVR.setAttribute('visible', false);
        clearInterval(this.timerCuenta);
        if (!this.jugando) this.inicio.style.display = 'flex';
      });
    },

    // crea un bate en cada control del visor (sirve para mano izquierda y derecha)
    prepararControles() {
      if (this.batesVR.length) return;
      const xr = this.el.renderer.xr;
      for (let i = 0; i < 2; i++) {
        const agarre = xr.getControllerGrip(i);      // posición de la mano que sostiene el control
        const bate = new THREE.Group();
        const mango = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.24, 12), new THREE.MeshBasicMaterial({ color: 0x3a2414 }));
        mango.rotation.x = -Math.PI / 2; mango.position.z = -0.08;
        const cuerpo = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.03, 0.62, 16), new THREE.MeshBasicMaterial({ color: 0xc8924f }));
        cuerpo.rotation.x = -Math.PI / 2; cuerpo.position.z = -0.5;
        const punta = new THREE.Object3D(); punta.position.z = -0.82;
        bate.add(mango, cuerpo, punta);
        bate.rotation.x = -Math.PI / 4;              // inclinado como se toma un bate
        agarre.add(bate);
        this.el.object3D.add(agarre);
        const datos = { agarre, punta, anterior: null, entrada: null };
        agarre.addEventListener('connected', (e) => { datos.entrada = e.data; });
        agarre.addEventListener('disconnected', () => { datos.entrada = null; });
        // gatillo de cualquier control: empezar al tiro
        const control = xr.getController(i);
        control.addEventListener('selectstart', () => { if (!this.jugando) { clearInterval(this.timerCuenta); this.empezar(); } });
        this.el.object3D.add(control);
        this.batesVR.push(datos);
      }
    },

    // muestra un texto en VR con cuenta regresiva y luego empieza solo
    cuentaRegresiva(texto, segundos) {
      clearInterval(this.timerCuenta);
      let n = segundos;
      const mostrar = () => {
        this.textoVR.setAttribute('value', texto + ' ' + n + '...');
        this.textoVR.setAttribute('visible', true);
      };
      mostrar();
      this.timerCuenta = setInterval(() => {
        n -= 1;
        if (n <= 0) { clearInterval(this.timerCuenta); if (this.modoVR && !this.jugando) this.empezar(); }
        else mostrar();
      }, 1000);
    },

    empezar() {
      clearInterval(this.timerCuenta);
      sonido('golpe');
      this.meteoritos.forEach((m) => this.el.object3D.remove(m.malla));
      this.meteoritos = [];
      this.puntos = 0; this.vidas = 3; this.nivel = 0;
      this.proximo = 1.5;
      this.jugando = true;
      this.inicio.style.display = 'none';
      this.textoVR.setAttribute('visible', false);
      this.actualizarHud();
    },

    actualizarHud() {
      this.hud.puntos.textContent = 'Puntaje: ' + this.puntos;
      this.hud.vidas.textContent = 'Vidas: ' + '❤'.repeat(this.vidas);
      this.hudVR.setAttribute('value', 'Puntaje: ' + this.puntos + '     Vidas: ' + this.vidas);
    },

    mostrarAviso(texto, color) {
      this.aviso.textContent = texto;
      this.aviso.style.color = color;
      this.aviso.style.opacity = 1;
      clearTimeout(this.timerAviso);
      this.timerAviso = setTimeout(() => {
        this.aviso.style.opacity = 0;
        this.hudVR.setAttribute('value', 'Puntaje: ' + this.puntos + '     Vidas: ' + this.vidas);
      }, 700);
      // en VR el texto 3D no tiene tildes, así que se las quitamos
      const sinTildes = texto.replace(/[ÁÀ]/g, 'A').replace(/[ÉÈ]/g, 'E').replace(/[ÍÌ]/g, 'I').replace(/[ÓÒ]/g, 'O').replace(/[ÚÙ]/g, 'U')
        .replace(/á/g, 'a').replace(/é/g, 'e').replace(/í/g, 'i').replace(/ó/g, 'o').replace(/ú/g, 'u').replace(/¡/g, '');
      this.hudVR.setAttribute('value', sinTildes);
    },

    // posición y dirección de la cabeza (sirve en pantalla y en VR)
    cabeza() {
      const cam = this.el.camera;
      const pos = new THREE.Vector3(); cam.getWorldPosition(pos);
      const dir = new THREE.Vector3(); cam.getWorldDirection(dir);
      return { pos, dir };
    },

    // crea un meteorito lejos y arriba, frente a donde está mirando el jugador
    lanzar() {
      const { pos, dir } = this.cabeza();
      const giro = Math.atan2(-dir.x, -dir.z) + (Math.random() - 0.5) * 1.1;
      const inicio = new THREE.Vector3(pos.x - Math.sin(giro) * 40, 30 + Math.random() * 8, pos.z - Math.cos(giro) * 40);
      // en VR pasa a la altura del pecho, al alcance del bate; en pantalla cae al suelo unos metros adelante
      const cerca = this.modoVR ? 0.7 : 2.5;
      const destino = new THREE.Vector3(pos.x - Math.sin(giro) * cerca + (Math.random() - 0.5) * 0.6,
                                        this.modoVR ? Math.max(0.9, pos.y - 0.5) : 0,
                                        pos.z - Math.cos(giro) * cerca + (Math.random() - 0.5) * 0.6);
      const rapidez = (this.modoVR ? 7 : 9) + this.nivel * 0.6;
      const vel = destino.clone().sub(inicio).normalize().multiplyScalar(rapidez);

      const malla = new THREE.Group();
      const roca = new THREE.Mesh(this.geo, new THREE.MeshBasicMaterial({ color: 0xff7a1a }));
      const cola = new THREE.Mesh(this.geoCola, new THREE.MeshBasicMaterial({ color: 0xffb347, transparent: true, opacity: 0.45, side: THREE.DoubleSide }));
      cola.position.y = 1.6;               // la cola queda detrás, en dirección contraria al movimiento
      malla.add(roca, cola);
      malla.position.copy(inicio);
      malla.quaternion.setFromUnitVectors(new THREE.Vector3(0, -1, 0), vel.clone().normalize());
      this.el.object3D.add(malla);
      this.meteoritos.push({ malla, roca, cola, vel, bateado: false, vida: 0 });
    },

    batear() {
      if (this.tiempoSwing < 1) return;     // ya está bateando
      this.tiempoSwing = 0;
      const { pos: posCam, dir: adelante } = this.cabeza();

      for (const m of this.meteoritos) {
        if (m.bateado) continue;
        const hacia = m.malla.position.clone().sub(posCam);
        const distancia = hacia.length();
        const angulo = adelante.angleTo(hacia.normalize());
        // le pega si está cerca y frente a la mirada
        if (distancia < 6 && angulo < THREE.MathUtils.degToRad(35)) {
          const vel = adelante.clone().multiplyScalar(30).add(new THREE.Vector3((Math.random() - 0.5) * 8, 14, 0));
          this.golpear(m, vel, angulo < THREE.MathUtils.degToRad(10));
          break;
        }
      }
    },

    golpear(m, vel, jonron) {
      m.bateado = true;
      m.vel = vel;
      m.roca.material.color.set(0xffe066);
      m.cola.visible = false;
      this.puntos += jonron ? 3 : 1;
      sonido('golpe');
      this.mostrarAviso(jonron ? '¡JONRÓN! +3' : '¡Crack! +1', jonron ? '#ffd166' : '#ffffff');
      this.nivel += 0.5;
      this.actualizarHud();
    },

    // explosión en el aire: chispas de colores, una onda de luz y un estruendo
    explotar(pos) {
      sonido('choque');
      const colores = [0xffe066, 0xff7a1a, 0xff3b1f, 0xffffff];
      for (let i = 0; i < 28; i++) {
        const chispa = new THREE.Mesh(this.geoChispa, new THREE.MeshBasicMaterial({ color: colores[i % 4], transparent: true }));
        chispa.position.copy(pos);
        const dir = new THREE.Vector3(Math.random() - 0.5, Math.random() - 0.3, Math.random() - 0.5).normalize();
        this.el.object3D.add(chispa);
        this.particulas.push({ malla: chispa, vel: dir.multiplyScalar(6 + Math.random() * 8), vida: 0 });
      }
      const onda = new THREE.Mesh(new THREE.SphereGeometry(0.5, 16, 12), new THREE.MeshBasicMaterial({ color: 0xffd166, transparent: true, opacity: 0.8 }));
      onda.position.copy(pos);
      this.el.object3D.add(onda);
      this.particulas.push({ malla: onda, vel: new THREE.Vector3(), vida: 0, onda: true });
    },

    // VR: el bate es un segmento desde el control hasta la punta; si toca un meteorito, lo golpea
    bateoVR(dt) {
      for (const bate of this.batesVR) {
        if (!bate.entrada) continue;                  // ese control no está conectado
        const a = new THREE.Vector3(); bate.agarre.getWorldPosition(a);
        const b = new THREE.Vector3(); bate.punta.getWorldPosition(b);
        const antes = bate.anterior || b.clone();
        const velPunta = b.clone().sub(antes).divideScalar(Math.max(dt, 0.001));
        bate.anterior = b.clone();
        if (velPunta.length() < 1.2) continue;        // hay que hacer el swing, no solo tocarlo
        const linea = new THREE.Line3(a, b);
        const cercano = new THREE.Vector3();
        for (const m of this.meteoritos) {
          if (m.bateado) continue;
          linea.closestPointToPoint(m.malla.position, true, cercano);
          if (cercano.distanceTo(m.malla.position) < 0.55) {
            const fuerza = velPunta.length();
            const vel = velPunta.clone().normalize().multiplyScalar(10 + fuerza * 3).add(new THREE.Vector3(0, 8, 0));
            this.golpear(m, vel, fuerza > 6);
            // vibración del control
            try { bate.entrada.gamepad.hapticActuators[0].pulse(1, 90); } catch (e) {}
          }
        }
      }
    },

    chocar(m) {
      sonido('choque');
      this.vidas -= 1;
      this.actualizarHud();
      this.flash.style.opacity = 0.55;
      setTimeout(() => (this.flash.style.opacity = 0), 120);
      // cráter en el suelo
      const crater = document.createElement('a-circle');
      crater.setAttribute('rotation', '-90 0 0');
      crater.setAttribute('radius', 0.9);
      crater.setAttribute('position', `${m.malla.position.x} 0.02 ${m.malla.position.z}`);
      crater.setAttribute('material', 'color: #1a0f08; shader: flat');
      this.el.appendChild(crater);
      setTimeout(() => crater.remove(), 6000);
      if (this.vidas <= 0) this.terminar();
      else this.mostrarAviso('¡Cayó uno!', '#ff6b4a');
    },

    terminar() {
      this.jugando = false;
      this.inicio.innerHTML = '<h1>Fin del juego</h1><p>Bateaste meteoritos por <b>' + this.puntos +
        '</b> puntos.</p><div class="btn">Jugar de nuevo</div>';
      if (this.modoVR) this.cuentaRegresiva('FIN DEL JUEGO: ' + this.puntos + ' puntos. Nueva partida en', 10);
      else this.inicio.style.display = 'flex';
    },

    tick(t, dtMs) {
      const dt = Math.min(dtMs / 1000, 0.05);

      // movimiento del bate: barrido horizontal de derecha a izquierda
      if (this.tiempoSwing < 1) this.tiempoSwing = Math.min(1, this.tiempoSwing + dt / 0.3);
      const s = this.tiempoSwing < 1 ? Math.sin(this.tiempoSwing * Math.PI / 2) : 0;
      this.pivote.rotation.set(0, THREE.MathUtils.degToRad(-35 + s * 230), THREE.MathUtils.degToRad(40 * (1 - s)));

      // chispas de las explosiones (se mueven y se apagan en 1 segundo)
      for (let i = this.particulas.length - 1; i >= 0; i--) {
        const p = this.particulas[i];
        p.vida += dt;
        if (p.onda) { p.malla.scale.setScalar(1 + p.vida * 12); p.malla.material.opacity = Math.max(0, 0.8 - p.vida * 2); }
        else { p.vel.y -= 6 * dt; p.malla.position.addScaledVector(p.vel, dt); p.malla.rotation.x += dt * 8; p.malla.material.opacity = Math.max(0, 1 - p.vida); }
        if (p.vida > 1) { this.el.object3D.remove(p.malla); p.malla.material.dispose(); this.particulas.splice(i, 1); }
      }

      if (!this.jugando) return;
      if (this.modoVR) this.bateoVR(dt);

      // un meteorito bateado que choca con uno que va cayendo: ¡explotan los dos en el aire!
      for (const a of this.meteoritos) {
        if (!a.bateado || a.exploto) continue;
        for (const b of this.meteoritos) {
          if (b.bateado || b.exploto) continue;
          if (a.malla.position.distanceTo(b.malla.position) < 1.2) {
            a.exploto = b.exploto = true;
            this.explotar(a.malla.position.clone().add(b.malla.position).multiplyScalar(0.5));
            this.puntos += 2;
            this.mostrarAviso('¡EXPLOSIÓN EN EL AIRE! +2', '#ff9f1c');
            this.actualizarHud();
            break;
          }
        }
      }

      // aparecen meteoritos cada vez más seguido
      this.proximo -= dt;
      if (this.proximo <= 0) {
        this.lanzar();
        this.proximo = Math.max(0.8, 2.4 - this.nivel * 0.12);
      }

      for (let i = this.meteoritos.length - 1; i >= 0; i--) {
        const m = this.meteoritos[i];
        m.vida += dt;
        if (m.bateado) m.vel.y -= 9.8 * dt;          // sale volando con gravedad
        m.malla.position.addScaledVector(m.vel, dt);
        m.roca.rotation.x += dt * 4; m.roca.rotation.y += dt * 3;
        const fuera = m.bateado && m.vida > 6;
        const cayo = !m.bateado && !m.exploto && m.malla.position.y <= 0.3;
        if (cayo) this.chocar(m);
        if (cayo || fuera || m.exploto || m.malla.position.y < -5) {
          this.el.object3D.remove(m.malla);
          this.meteoritos.splice(i, 1);
        }
      }
    }
  });
</script>
</head>
<body>
<div id="hud"><span id="puntos">Puntaje: 0</span><span id="vidas">Vidas: ❤❤❤</span></div>
<div id="aviso"></div>
<div id="flash"></div>
<div id="inicio">
  <h1>Meteoritos en Atacama</h1>
  <p>Caen meteoritos sobre el desierto. ¡Batéalos antes de que choquen!</p>
  <p><b>Mira</b> al meteorito (arrastra el mouse o mueve el celular) y <b>batea</b> con clic, toque o barra espaciadora cuando esté cerca.</p>
  <p>Si le pegas justo al centro: ¡jonrón!</p>
  <div class="btn">Jugar</div>
</div>

<a-scene juego background="color: #050814" renderer="antialias: true">
  <a-entity estrellas="cantidad: 900"></a-entity>

  <!-- Suelo del desierto y cerros -->
  <a-circle rotation="-90 0 0" radius="60" material="color: #3b2716; shader: flat"></a-circle>
  <a-cone position="-18 3 -30" radius-bottom="12" radius-top="0" height="8" material="color: #24170d; shader: flat"></a-cone>
  <a-cone position="20 2.5 -26" radius-bottom="10" radius-top="0" height="6" material="color: #24170d; shader: flat"></a-cone>
  <a-cone position="2 2 32" radius-bottom="14" radius-top="0" height="5" material="color: #24170d; shader: flat"></a-cone>

  <!-- Cúpula de observatorio -->
  <a-cylinder position="6 1.2 -12" radius="2.2" height="2.4" material="color: #d9d9d9"></a-cylinder>
  <a-sphere position="6 2.4 -12" radius="2.2" theta-length="90" material="color: #efefef"></a-sphere>

  <!-- Cámara del jugador con el bate en la mano -->
  <a-entity id="camara" camera look-controls="reverseMouseDrag: true" wasd-controls="enabled: false" position="0 1.6 0">
    <a-entity id="bate" position="0.16 -0.26 -0.42">
      <!-- el bate apunta hacia +X dentro del pivote -->
      <a-cylinder position="0.12 0 0" rotation="0 0 90" radius="0.022" height="0.24" material="color: #3a2414"></a-cylinder>
      <a-cone position="0.52 0 0" rotation="0 0 -90" radius-bottom="0.03" radius-top="0.055" height="0.6" material="color: #c8924f"></a-cone>
    </a-entity>
    <!-- mira al centro -->
    <a-ring id="mira" position="0 0 -1" radius-inner="0.012" radius-outer="0.02" material="color: #ffffff; shader: flat"></a-ring>
    <!-- puntaje dentro de la escena (para VR) -->
    <a-text id="hudVR" visible="false" value="Puntaje: 0     Vidas: 3" position="0 0.42 -1.5" align="center" width="1.6" color="#ffd166"></a-text>
  </a-entity>

  <!-- Texto de inicio dentro de la escena (VR) -->
  <a-text id="textoVR" visible="false" value=""
          position="0 1.8 -3" align="center" width="4" color="#ffffff" wrap-count="34"></a-text>

</a-scene>
</body>
</html>
